appId: com.xzorez.filmdex
productName: Filmdex
copyright: Copyright © 2026 Xzorez

directories:
  buildResources: build
  output: release

files:
  - out/**/*
  - package.json
  - '!**/*.map'

# De donde se descargan las actualizaciones automaticas.
publish:
  provider: github
  owner: Xzorez
  repo: filmdex
  releaseType: release

win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: ${productName}-${version}-setup.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Filmdex
  deleteAppDataOnUninstall: false

linux:
  target: [AppImage]
  category: AudioVideo
  artifactName: ${productName}-${version}.${ext}

mac:
  target: [dmg]
  category: public.app-category.entertainment
  artifactName: ${productName}-${version}.${ext}
